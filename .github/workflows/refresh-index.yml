name: Refresh indexes

# Each plugin carries an index of its catalogue: reading the catalogue live doesn't fit in a
# plugin command's fuel. Each month this rebuilds the indexes with the plugins' own readers and,
# when a catalogue changed, opens a pull request with the new index to review and release.
#
# Barranquilla's servers answer clients whose User-Agent starts with `RustGIS/` (an exception the
# Alcaldía made for RustGIS); anything else gets Cloudflare's 403.
#
# The repository must let GitHub Actions create pull requests (Settings › Actions › General ›
# Workflow permissions). Pull requests opened with the workflow's token don't start CI: close and
# reopen one, or push to it, to run it.
on:
  schedule:
    # The 1st of each month, 06:00 in Barranquilla. Run it by hand from the Actions tab at any time.
    - cron: "0 11 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ide-barranquilla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rebuild the index
        run: |
          curl -sSf --retry 3 --max-time 60 \
            -A 'RustGIS/ide-barranquilla-index (+https://github.com/jgregoriorincon/rustgis-ide-barranquilla)' \
            'https://geobaq.barranquilla.gov.co/WS/Geovisor.ashx?cmd=get' -o "$RUNNER_TEMP/geovisor.json"
          cargo run -q -p ide-barranquilla --example index -- "$(date -u +%F)" ide-barranquilla/index.json \
            < "$RUNNER_TEMP/geovisor.json" > "$RUNNER_TEMP/index.json" 2> "$RUNNER_TEMP/summary.txt"
          cat "$RUNNER_TEMP/summary.txt"
          summary=$(tail -n 1 "$RUNNER_TEMP/summary.txt")
          case "$summary" in
            changed:*)
              mv "$RUNNER_TEMP/index.json" ide-barranquilla/index.json
              echo "SUMMARY=$summary" >> "$GITHUB_ENV"
              ;;
            incomplete)
              echo "::warning::Barranquilla's catalogue answered with too few services; the index stays as it is."
              ;;
          esac
      - name: Propose the new index
        if: env.SUMMARY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="refresh/ide-barranquilla-index-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add ide-barranquilla/index.json
          git commit -m "chore(ide-barranquilla): refresh Barranquilla's index"
          git push -u origin "$branch"
          gh pr create --title "chore(ide-barranquilla): refresh Barranquilla's index" \
            --body "Barranquilla's catalogue $SUMMARY since the last index. Review it, then bump ide-barranquilla's version and release it."
